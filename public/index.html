<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenTerm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="tape" aria-label="Market ticker tape"><div id="tape-track"></div></div>

<nav id="fkeys"></nav>

<div id="cmdbar">
  <span class="mkt-tag">US</span>
  <div id="cmdwrap"><input id="cmd" autofocus autocomplete="off" spellcheck="false" placeholder="Ticker or command: AAPL, AAPL FA, HELP  ( / to focus )"><div id="ac" hidden></div></div>
  <button id="go" type="button">GO</button>
  <span id="clock"></span>
</div>

<nav id="tabs"></nav>

<main id="grid"></main>

<footer id="statusbar">
  <span>OPENTERM</span><span id="sbdata">Loading...</span><span id="sbclock"></span>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
