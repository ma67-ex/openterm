<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenTerm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="logo">OPENTERM</span>
  <input id="cmd" autofocus autocomplete="off" spellcheck="false" placeholder="Command: AAPL  |  CHART TSLA  |  NEWS NVDA  |  HELP">
  <span id="clock"></span>
</header>
<main>
  <section class="panel" id="watch"><h2>WATCHLIST</h2><div id="watchlist"></div></section>
  <section class="panel" id="chartp"><h2 id="charttitle">CHART</h2><canvas id="chart"></canvas></section>
  <section class="panel" id="newsp"><h2>NEWS</h2><div id="news"></div></section>
</main>
<footer id="status">Data: free sources, delayed. Not investment advice.</footer>
<script type="module" src="app.js"></script>
</body>
</html>
